<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Practice - Ijaz</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
        }

        h1 {
            color: #0066cc;
        }

        .output {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            margin-top: 20px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }

        .output p {
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
            margin: 0;
        }

        .output p:last-child {
            border-bottom: none;
        }

        button {
            background-color: #0066cc;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        button:hover {
            background-color: #0052a3;
        }
    </style>
</head>
<body>

    <h1>JavaScript Practice</h1>
    <p>Yeh page JavaScript seekhne ke liye hai. Neeche output dikhega.</p>

    <!-- Yeh div hamara "output box" hai -->
    <div class="output" id="output">
        <p>Abhi kuch nahi hua...</p>
    </div>

    <!-- Script file -->
    <script src="script.js"></script>

</body>
</html>
